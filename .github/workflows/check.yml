name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "latest-known"
      - run: uv sync --group dev
      - run: python3 dev.py check
