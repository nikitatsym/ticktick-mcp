[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticktick-mcp"
version = "1.0.9"
description = "MCP server for TickTick task manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "typing-extensions>=4.5",
]
keywords = ["mcp", "ticktick", "tasks", "model-context-protocol", "claude", "ai"]

[project.scripts]
ticktick-mcp = "ticktick_mcp:main"

[project.urls]
Homepage = "https://github.com/nikitatsym/ticktick-mcp"
Repository = "https://github.com/nikitatsym/ticktick-mcp"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a real TickTick account (set TICKTICK_* env vars)",
]

[tool.ruff.lint]
ignore = ["F541", "F401"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
files = ["src/"]
